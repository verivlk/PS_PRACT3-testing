name: CI

on:
  push:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      
      # - name: Install uv
      #   run: pip install uv

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ruff and mypy
        run: uv pip install ruff mypy pytest pytest-bdd

      - name: Ruff format
        run: uv ruff format .

      - name: Ruff linter
        run: uv ruff check . --fix

